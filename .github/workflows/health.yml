# בקרת שרת - אתר ארנפלד סוכנות לביטוח (קובי 12.10.2026, אחרי שמסד הנתונים נפל בלילה ואף אחד לא ידע).
# רץ בשרתים של גיטהאב כל 10 דקות - לא על המחשב של קובי ולא על האתר עצמו, כדי שיעבוד גם כשהם נופלים.
# הריצה נכשלת (וגיטהאב שולח מייל) כשהמסד איטי מ-1.5 שניות או לא עונה, 3 פעמים ברצף בהפרש חצי דקה.
# "איטי" = אזהרה מוקדמת: כנראה צריך להגדיל את השרת (Cloud > Advanced settings), לפני שהוא קורס.
name: בקרת שרת - ארנפלד (סוכנות + משכנתאות + הלוואות + נדל"ן)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת לבדיקה (לבדיקת כשל מכוונת בלבד)"
        default: "https://erenfeld-ins.co.il/api/public/health"
      alert_test:
        description: "לשלוח התראת וואטסאפ לקובי גם כשהכל תקין (בדיקה מכוונת)"
        default: "false"
permissions:
  contents: write
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: מסד הנתונים של erenfeld-ins.co.il
        run: |
          url="${{ inputs.url || 'https://erenfeld-ins.co.il/api/public/health' }}"
          for i in 1 2 3; do
            body=$(curl -s -m 25 -w '\n%{http_code}' "$url?r=$RANDOM") || body=$'\n000'
            code=$(echo "$body" | tail -1); json=$(echo "$body" | head -n -1)
            echo "try $i: http=$code $json"
            if [ "$code" = "200" ] && echo "$json" | grep -q '"status":"ok"'; then echo "OK"; exit 0; fi
            sleep 30
          done
          echo "::error title=השרת של אתר הסוכנות במצוקה::המסד איטי או לא עונה 3 פעמים ברצף ($json). לבדוק CPU/Memory ב-Lovable Cloud > Advanced settings ולשקול הגדלה."
          exit 1
      - name: דף הבית של erenfeld-ins.co.il
        run: |
          code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://erenfeld-ins.co.il/?r=$RANDOM")
          echo "home http=$code"
          [ "$code" = "200" ] || { echo "::error title=דף הבית לא עונה::http=$code"; exit 1; }
      - name: מאמרים של erenfeld-ins.co.il (GET אמיתי, לא רק בדיקת המסד)
        # 16.10.2026: מאמרים שלא היו במטמון נתקעו דקות ארוכות, בזמן שבדיקת המסד ודף הבית עברו.
        # פרמטר אקראי מכריח את מסלול הרינדור. דף שלא עונה תוך 20 שניות מקבל ניסיון שני אחרי 30 שניות.
        run: |
          bad=0
          # 30.10.2026: הכתובת של כתבת איתור הכספים השתנתה והמשגיח נכשל על 301 - לא תקלה באתר אלא הפניה.
          # מעכשיו הבדיקה הולכת עד היעד (-L) ומודדת את הקוד הסופי, כדי שהפניה לא תעיר את קובי בלילה.
          for p in /har-habituach /maslaka-pensionit /find-funds-policies/articles/life-insurance-har-habituach-report /health-insurance/articles/health-insurance-cost; do
            for t in 1 2; do
              r=$(curl -sL -o /dev/null -m 20 -H 'x-cache-refresh: 1' -w '%{http_code} %{time_total}' "https://erenfeld-ins.co.il$p?r=$RANDOM") || r="000 20"
              echo "$p try $t: $r"
              [ "${r%% *}" = "200" ] && break
              [ $t = 1 ] && sleep 30
            done
            [ "${r%% *}" = "200" ] || { echo "::error title=דף באתר הסוכנות לא נטען::$p ($r)"; bad=1; }
          done
          exit $bad
  e-mortgages:
    # אתר ארנפלד משכנתאות (עלה ללאבייבל 12.10.2026). אותה בדיקה: מסד + אחסון דרך /api/public/health,
    # 3 תוצאות רעות ברצף = הריצה נכשלת וגיטהאב שולח מייל. ודף הבית ומחשבון המשכנתא עונים 200.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: מסד הנתונים של e-mortgages.co.il
        run: |
          url="https://e-mortgages.co.il/api/public/health"
          for i in 1 2 3; do
            body=$(curl -s -m 25 -w '\n%{http_code}' "$url?r=$RANDOM") || body=$'\n000'
            code=$(echo "$body" | tail -1); json=$(echo "$body" | head -n -1)
            echo "try $i: http=$code $json"
            if [ "$code" = "200" ] && echo "$json" | grep -q '"status":"ok"'; then echo "OK"; exit 0; fi
            sleep 30
          done
          echo "::error title=השרת של אתר המשכנתאות במצוקה::המסד איטי או לא עונה 3 פעמים ברצף ($json). לבדוק CPU/Memory ב-Lovable Cloud > Advanced settings של Erenfeld Mortgages."
          exit 1
      - name: דף הבית ומחשבון המשכנתא
        run: |
          for p in "/" "/%D7%9E%D7%97%D7%A9%D7%91%D7%95%D7%9F-%D7%9E%D7%A9%D7%9B%D7%A0%D7%AA%D7%90"; do
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://e-mortgages.co.il$p?r=$RANDOM")
            echo "$p http=$code"
            [ "$code" = "200" ] || { echo "::error title=אתר המשכנתאות לא עונה::$p http=$code"; exit 1; }
          done
  e-realestate:
    # אתר ארנפלד נדל"ן (e-realestate.co.il). אותה בדיקה: מסד + אחסון דרך /api/public/health,
    # 3 תוצאות רעות ברצף = הריצה נכשלת וגיטהאב שולח מייל. ודף הבית וקטגוריית אירופה (הכתובת המקוננת,
    # 1,028 הופעות ב-90 יום) עונים 200. נדחף רק אחרי שה-health עונה 200 על הדומיין (יום המעבר).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: מסד הנתונים של e-realestate.co.il
        run: |
          url="https://e-realestate.co.il/api/public/health"
          for i in 1 2 3; do
            body=$(curl -s -m 25 -w '\n%{http_code}' "$url?r=$RANDOM") || body=$'\n000'
            code=$(echo "$body" | tail -1); json=$(echo "$body" | head -n -1)
            echo "try $i: http=$code $json"
            if [ "$code" = "200" ] && echo "$json" | grep -q '"status":"ok"'; then echo "OK"; exit 0; fi
            sleep 30
          done
          echo "::error title=השרת של אתר הנדל״ן במצוקה::המסד איטי או לא עונה 3 פעמים ברצף ($json). לבדוק CPU/Memory ב-Lovable Cloud > Advanced settings של Erenfeld Realestate."
          exit 1
      - name: דף הבית וקטגוריית אירופה
        run: |
          for p in "/" "/%D7%94%D7%A9%D7%A7%D7%A2%D7%95%D7%AA-%D7%A0%D7%93%D7%9C%D7%9F-%D7%91%D7%97%D7%95%D7%9C/%D7%94%D7%A9%D7%A7%D7%A2%D7%95%D7%AA-%D7%A0%D7%93%D7%9C%D7%9F-%D7%91%D7%90%D7%99%D7%A8%D7%95%D7%A4%D7%94"; do
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://e-realestate.co.il$p?r=$RANDOM")
            echo "$p http=$code"
            [ "$code" = "200" ] || { echo "::error title=אתר הנדל״ן לא עונה::$p http=$code"; exit 1; }
          done
  e-loans:
    # אתר ארנפלד הלוואות (עלה ללאבייבל ב-13.10.2026). אותה בדיקה: מסד + אחסון דרך /api/public/health,
    # 3 תוצאות רעות ברצף = הריצה נכשלת וגיטהאב שולח מייל. ודף הבית ו"צור קשר" (הטופס) עונים 200.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: מסד הנתונים של e-loans.co.il
        run: |
          url="https://e-loans.co.il/api/public/health"
          for i in 1 2 3; do
            body=$(curl -s -m 25 -w '\n%{http_code}' "$url?r=$RANDOM") || body=$'\n000'
            code=$(echo "$body" | tail -1); json=$(echo "$body" | head -n -1)
            echo "try $i: http=$code $json"
            if [ "$code" = "200" ] && echo "$json" | grep -q '"status":"ok"'; then echo "OK"; exit 0; fi
            sleep 30
          done
          echo "::error title=השרת של אתר ההלוואות במצוקה::המסד איטי או לא עונה 3 פעמים ברצף ($json). לבדוק CPU/Memory ב-Lovable Cloud > Advanced settings של Erenfeld Loans."
          exit 1
      - name: דף הבית וצור קשר
        run: |
          for p in "/" "/%D7%A6%D7%95%D7%A8-%D7%A7%D7%A9%D7%A8"; do
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://e-loans.co.il$p?r=$RANDOM")
            echo "$p http=$code"
            [ "$code" = "200" ] || { echo "::error title=אתר ההלוואות לא עונה::$p http=$code"; exit 1; }
          done

  keepalive:
    # גיטהאב מכבה תזמון במאגר ציבורי אחרי 60 יום בלי פעילות - קומיט קטן ב-1 לכל חודש שומר אותו חי.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: keepalive
        run: |
          if [ "$(date -u +%d%H%M | cut -c1-4)" = "0103" ] && [ "$(date -u +%M)" -lt 10 ]; then
            date -u +%F > .keepalive
            git config user.name "erenfeld-monitor"; git config user.email "monitor@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive $(date -u +%F)" && git push
          else echo "not today"; fi
  insuland:
    # אתר אינשולנד (insuland.co.il, עלה ללאבייבל 19.10.2026 13:10). אותה בדיקה: מסד + אחסון דרך /api/public/health,
    # 3 תוצאות רעות ברצף = הריצה נכשלת וגיטהאב שולח מייל. ודף הבית ועמוד ביטוח בריאות (הכתובת עם הכי הרבה חשיפות) עונים 200.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: מסד הנתונים של insuland.co.il
        run: |
          url="https://insuland.co.il/api/public/health"
          for i in 1 2 3; do
            body=$(curl -s -m 25 -w '\n%{http_code}' "$url?r=$RANDOM") || body=$'\n000'
            code=$(echo "$body" | tail -1); json=$(echo "$body" | head -n -1)
            echo "try $i: http=$code $json"
            if [ "$code" = "200" ] && echo "$json" | grep -q '"status":"ok"'; then echo "OK"; exit 0; fi
            sleep 30
          done
          echo "::error title=השרת של אינשולנד במצוקה::המסד איטי או לא עונה 3 פעמים ברצף ($json). לבדוק CPU/Memory ב-Lovable Cloud > Advanced settings של Erenfeld Insuland."
          exit 1
      - name: דף הבית ועמוד ביטוח בריאות
        run: |
          for p in "/" "/%D7%91%D7%99%D7%98%D7%95%D7%97-%D7%91%D7%A8%D7%99%D7%90%D7%95%D7%AA"; do
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://insuland.co.il$p?r=$RANDOM")
            echo "$p http=$code"
            [ "$code" = "200" ] || { echo "::error title=אינשולנד לא עונה::$p http=$code"; exit 1; }
          done

  # (ב) התראת וואטסאפ לקובי כשאתר לא באוויר (הכרעת קובי 30.10.2026: וואטסאפ לשלושה מקרים, וזה אחד מהם).
  # נשלח מכאן ולא מהאתר, כי אתר שנפל לא יכול להתריע על עצמו. סדר הערוצים כמו ב-owner-events.server.ts:
  # 1. טקסט חופשי (עובד רק אם חלון 24 השעות של קובי מול המספר העסקי פתוח),
  # 2. התבנית המאושרת owner_event_v1 (סוכן הוואטסאפ מגיש אותה לאישור מטא),
  # 3. המייל של גיטהאב על ריצה שנכשלה - נשלח ממילא, ולכן ההתראה לעולם לא שקטה.
  # הסודות (קובי מוסיף ב-Settings > Secrets and variables > Actions): WA_TOKEN, WA_PHONE_NUMBER_ID.
  # בלי הסודות המשימה לא נכשלת - היא כותבת שורה ביומן ומסתיימת, והמייל נשאר הערוץ היחיד.
  alert:
    needs: [health, e-mortgages, e-realestate, e-loans, insuland]
    if: always() && (failure() || inputs.alert_test == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: וואטסאפ לקובי - אתר לא באוויר
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          OWNER_WA: "972526608687"
          R_HEALTH: ${{ needs.health.result }}
          R_MORT: ${{ needs['e-mortgages'].result }}
          R_REAL: ${{ needs['e-realestate'].result }}
          R_LOANS: ${{ needs['e-loans'].result }}
          R_INSU: ${{ needs.insuland.result }}
          IS_TEST: ${{ inputs.alert_test }}
        run: |
          down=""
          [ "$R_HEALTH" = "failure" ] && down="$down erenfeld-ins.co.il"
          [ "$R_MORT"   = "failure" ] && down="$down e-mortgages.co.il"
          [ "$R_REAL"   = "failure" ] && down="$down e-realestate.co.il"
          [ "$R_LOANS"  = "failure" ] && down="$down e-loans.co.il"
          [ "$R_INSU"   = "failure" ] && down="$down insuland.co.il"
          [ "$IS_TEST" = "true" ] && down="${down:- (בדיקה מכוונת, שום אתר לא נפל)}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          text="האתר לא באוויר:$down. הבקרה נכשלה 3 פעמים ברצף. $run_url"
          echo "ההתראה: $text"
          if [ -z "$WA_TOKEN" ] || [ -z "$WA_PHONE_NUMBER_ID" ]; then
            echo "::warning title=אין סוד וואטסאפ::WA_TOKEN / WA_PHONE_NUMBER_ID לא הוגדרו במאגר. ההתראה יוצאת רק במייל של גיטהאב."
            exit 0
          fi
          api="https://graph.facebook.com/v25.0/$WA_PHONE_NUMBER_ID/messages"
          free=$(curl -s -m 25 -X POST "$api" -H "Authorization: Bearer $WA_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg to "$OWNER_WA" --arg b "$text" '{messaging_product:"whatsapp",to:$to,type:"text",text:{body:$b}}')")
          echo "free text: $(echo "$free" | head -c 400)"
          if echo "$free" | grep -q '"messages"'; then echo "נשלח בטקסט חופשי"; exit 0; fi
          tpl=$(curl -s -m 25 -X POST "$api" -H "Authorization: Bearer $WA_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg to "$OWNER_WA" --arg a "האתר לא באוויר:$down" --arg u "$run_url" \
              '{messaging_product:"whatsapp",to:$to,type:"template",template:{name:"owner_event_v1",language:{code:"he"},components:[{type:"body",parameters:[{type:"text",text:$a},{type:"text",text:$u}]}]}}')")
          echo "template: $(echo "$tpl" | head -c 400)"
          if echo "$tpl" | grep -q '"messages"'; then echo "נשלח בתבנית owner_event_v1"; exit 0; fi
          echo "::warning title=הוואטסאפ לא יצא::גם טקסט חופשי וגם התבנית נדחו. ההתראה יוצאת במייל של גיטהאב."
