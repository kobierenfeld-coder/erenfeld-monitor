# גשר תקלות לפעמון ב-CRM (קובי 28.10.2026: "שיעבוד גם שהמחשב כבוי").
# סוכן הכונן בענן (Claude routine) לא מחזיק סודות. כשהוא מטפל בתקלה הוא דוחף קובץ JSON לתיקייה incidents/
# (בכל ענף), והזרימה הזו שולחת אותו לפעמון ב-CRM עם המפתח שנשמר כסוד בגיטהאב (LOVABLE_WORKER_KEY).
# קובץ: {"level": "success|warning|problem", "title_he": "...", "body_he": "...", "dedupe_key": "..."}
name: גשר תקלות לפעמון
on:
  push:
    paths:
      - "incidents/**.json"
permissions:
  contents: read
jobs:
  bell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: שליחת התקלות החדשות לפעמון
        env:
          KEY: ${{ secrets.LOVABLE_WORKER_KEY }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -e
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            files=$(git show --pretty=format: --name-only --diff-filter=A "$AFTER" -- 'incidents/*.json')
          else
            files=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'incidents/*.json')
          fi
          [ -n "$files" ] || { echo "no new incident files"; exit 0; }
          fail=0
          for f in $files; do
            # 28.10.2026: only what needs Kobi; fixed/warning files are a log.
            [ "$(jq -r '.level // "problem"' "$f")" = "problem" ] || { echo "$f: log only"; continue; }
            body=$(jq -c '{kind:"incident_responder_cloud", level:(.level // "problem"), title_he, body_he, dedupe_key:("cloud:" + (.dedupe_key // input_filename))}' "$f")
            code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -m 40 -X POST \
              -H "X-API-Key: $KEY" -H 'Content-Type: application/json' -H 'Accept: application/json' \
              -H 'User-Agent: harb-worker/1.0 (+erenfeld-crm scan worker)' \
              --data "$body" https://erenfeld-ins.co.il/api/public/scan/notifications)
            echo "$f -> $code $(head -c 200 /tmp/r.txt)"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
